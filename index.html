<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学校備品管理システム</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        /* Custom modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header (Login/Logout) -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight">学校備品管理</h1>
        <div id="user-info" class="hidden flex items-center space-x-4">
            <span id="user-email" class="text-sm font-medium"></span>
            <button id="logout-btn" class="bg-blue-700 hover:bg-blue-800 text-white text-sm py-2 px-4 rounded transition duration-150">ログアウト</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        
        <!-- Login View (Shown when not authenticated) -->
        <div id="login-view" class="flex flex-col items-center justify-center h-[60vh]">
            <div class="bg-white p-8 rounded-lg shadow-lg text-center max-w-md w-full">
                <svg class="mx-auto h-16 w-16 text-blue-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <h2 class="text-2xl font-bold mb-2">ログインが必要です</h2>
                <p class="text-gray-600 mb-6">備品の貸出・返却を記録するには、Googleアカウントでログインしてください。</p>
                <button id="login-btn" class="w-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 py-3 px-4 rounded flex items-center justify-center space-x-2 transition duration-150 shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
                    <span>Googleでログイン</span>
                </button>
            </div>
        </div>

        <!-- App View (Shown when authenticated) -->
        <div id="app-view" class="hidden">
            <!-- Alert Message Container -->
            <div id="alert-container" class="mb-4"></div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Form Section -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h2 class="text-lg font-bold mb-4 border-b pb-2">貸出の登録</h2>
                        <form id="rental-form" class="space-y-4">
                            <div>
                                <label for="item-name" class="block text-sm font-medium text-gray-700 mb-1">備品名 <span class="text-red-500">*</span></label>
                                <input type="text" id="item-name" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例: プロジェクター A">
                            </div>
                            <div>
                                <label for="borrower-name" class="block text-sm font-medium text-gray-700 mb-1">借りる人 <span class="text-red-500">*</span></label>
                                <input type="text" id="borrower-name" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例: 山田 太郎">
                            </div>
                            <div>
                                <label for="borrow-date" class="block text-sm font-medium text-gray-700 mb-1">貸出日 <span class="text-red-500">*</span></label>
                                <input type="date" id="borrow-date" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label for="return-date" class="block text-sm font-medium text-gray-700 mb-1">返却予定日 <span class="text-red-500">*</span></label>
                                <input type="date" id="return-date" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label for="status" class="block text-sm font-medium text-gray-700 mb-1">返却状況</label>
                                <select id="status" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                    <option value="貸出中">貸出中</option>
                                    <option value="返却済">返却済</option>
                                </select>
                            </div>
                            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition duration-150 mt-4">
                                登録する
                            </button>
                        </form>
                    </div>
                </div>

                <!-- List Section -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-lg shadow-md overflow-hidden">
                        <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                            <h2 class="text-lg font-bold">貸出・返却 履歴</h2>
                            <span class="text-sm text-gray-500" id="record-count">0 件</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider">
                                        <th class="p-4 font-medium border-b">備品名</th>
                                        <th class="p-4 font-medium border-b">借りた人</th>
                                        <th class="p-4 font-medium border-b">貸出日</th>
                                        <th class="p-4 font-medium border-b">返却予定日</th>
                                        <th class="p-4 font-medium border-b">状況</th>
                                        <th class="p-4 font-medium border-b text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="records-body" class="divide-y divide-gray-200">
                                    <!-- Data will be inserted here dynamically -->
                                    <tr id="loading-row">
                                        <td colspan="6" class="p-8 text-center text-gray-500">
                                            データを読み込み中...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Modal for Delete Confirmation -->
    <div id="delete-modal" class="modal flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm mx-4 transform transition-all">
            <h3 class="text-lg font-medium text-gray-900 mb-4">本当に削除しますか？</h3>
            <p class="text-sm text-gray-500 mb-6">この操作は取り消せません。</p>
            <div class="flex justify-end space-x-3">
                <button id="cancel-delete" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded font-medium">キャンセル</button>
                <button id="confirm-delete" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-medium">削除する</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        // ---------------------------------------------------------
        // 1. Firebaseのインポート (CDN経由)
        // ---------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider,
            onAuthStateChanged,
            signOut,
            signInWithCustomToken,
            signInAnonymously
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            query, 
            orderBy, 
            doc, 
            updateDoc,
            deleteDoc,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ---------------------------------------------------------
        // 2. Firebase設定
        // ※ 実際のホスティング環境では、環境変数やFirebase Hostingの自動設定から取得します。
        // ここでは、Artifacts環境用の設定を使用します。
        // ---------------------------------------------------------
        let firebaseConfig = {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-equipment-app';

        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            } else {
                // ダミー設定 (プレビュー環境用)
                console.warn("Using placeholder Firebase config. Real database requires setup.");
                firebaseConfig = {
                    apiKey: "demo-key",
                    authDomain: "demo.firebaseapp.com",
                    projectId: "demo-project",
                    storageBucket: "demo.appspot.com",
                    messagingSenderId: "123456789",
                    appId: "1:123456789:web:abcdef"
                };
            }
        } catch (e) {
            console.error("Error parsing firebase config:", e);
        }

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ---------------------------------------------------------
        // 3. UI Element References
        // ---------------------------------------------------------
        // Views
        const loginView = document.getElementById('login-view');
        const appView = document.getElementById('app-view');
        
        // Header Auth info
        const userInfo = document.getElementById('user-info');
        const userEmail = document.getElementById('user-email');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        
        // Form Elements
        const rentalForm = document.getElementById('rental-form');
        const itemNameInput = document.getElementById('item-name');
        const borrowerNameInput = document.getElementById('borrower-name');
        const borrowDateInput = document.getElementById('borrow-date');
        const returnDateInput = document.getElementById('return-date');
        const statusSelect = document.getElementById('status');
        const submitBtn = document.getElementById('submit-btn');
        
        // Table Elements
        const recordsBody = document.getElementById('records-body');
        const recordCount = document.getElementById('record-count');
        
        // Alert & Modal
        const alertContainer = document.getElementById('alert-container');
        const deleteModal = document.getElementById('delete-modal');
        const cancelDeleteBtn = document.getElementById('cancel-delete');
        const confirmDeleteBtn = document.getElementById('confirm-delete');

        // State
        let currentUser = null;
        let unsubscribeSnapshot = null;
        let itemToDelete = null;

        // 今日の日付を貸出日のデフォルト値に設定
        const today = new Date().toISOString().split('T')[0];
        borrowDateInput.value = today;

        // ---------------------------------------------------------
        // 4. Authentication Logic
        // ---------------------------------------------------------

        // カスタムUIアラート関数（alert()の代わり）
        function showAlert(message, type = 'success') {
            const bgClass = type === 'error' ? 'bg-red-100 border-red-400 text-red-700' : 'bg-green-100 border-green-400 text-green-700';
            const alertHtml = `
                <div class="${bgClass} border px-4 py-3 rounded relative" role="alert">
                    <span class="block sm:inline">${message}</span>
                </div>
            `;
            alertContainer.innerHTML = alertHtml;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Login Helper
        async function handleLogin() {
            try {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="animate-spin mr-2">↻</span> ログイン中...';
                
                // Note: Artifacts環境では popup はブロックされる場合があるため、
                // 実際のアプリ (Firebase Hosting上) では signInWithPopup を使用します。
                // ここではデモ環境用のフォールバックも用意します。
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    // Try real Google Auth, fallback to anonymous if blocked (in preview)
                    try {
                        await signInWithPopup(auth, provider);
                    } catch (e) {
                         console.log("Popup failed, trying anonymous auth for preview", e);
                         await signInAnonymously(auth);
                    }
                }
            } catch (error) {
                console.error("Login Error:", error);
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5"><span>Googleでログイン</span>`;
                // エラー表示
                const errorDiv = document.createElement('div');
                errorDiv.className = 'mt-4 text-red-500 text-sm';
                errorDiv.innerText = 'ログインに失敗しました。';
                loginBtn.parentNode.appendChild(errorDiv);
            }
        }

        // Logout Helper
        async function handleLogout() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout Error:", error);
            }
        }

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // Logged in
                loginView.classList.add('hidden');
                appView.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                
                // 表示名またはメールアドレスを表示（匿名ログインの場合は "ゲスト"）
                const displayName = user.displayName || user.email || "ゲストユーザー";
                userEmail.textContent = displayName;

                // Load Data
                setupDataListener();
            } else {
                // Logged out
                loginView.classList.remove('hidden');
                appView.classList.add('hidden');
                userInfo.classList.add('hidden');
                
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5"><span>Googleでログイン</span>`;

                // Clean up listener
                if (unsubscribeSnapshot) {
                    unsubscribeSnapshot();
                }
                recordsBody.innerHTML = '';
            }
        });

        // Attach Auth Event Listeners
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);

        // ---------------------------------------------------------
        // 5. Database Logic (Firestore)
        // ---------------------------------------------------------

        // コレクションパスの取得
        // 全員で共有するデータの場合は public/data/... を使用します
        function getCollectionRef() {
            if (!currentUser) return null;
            // RULE 1: Strict Paths - artifacts/{appId}/public/data/{collectionName}
            return collection(db, 'artifacts', appId, 'public', 'data', 'rentals');
        }

        // Create - データの追加
        rentalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentUser) {
                showAlert('エラー: ログインしていません。', 'error');
                return;
            }

            const colRef = getCollectionRef();
            if (!colRef) return;

            const submitBtnOriginalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = '保存中...';

            try {
                const newData = {
                    itemName: itemNameInput.value.trim(),
                    borrowerName: borrowerNameInput.value.trim(),
                    borrowDate: borrowDateInput.value,
                    returnDate: returnDateInput.value,
                    status: statusSelect.value,
                    createdAt: serverTimestamp(),
                    createdBy: currentUser.uid, // 誰が登録したかを記録
                    creatorName: currentUser.displayName || currentUser.email || 'ゲスト'
                };

                await addDoc(colRef, newData);
                
                // フォームをリセット (日付以外)
                itemNameInput.value = '';
                borrowerNameInput.value = '';
                statusSelect.value = '貸出中';
                itemNameInput.focus();
                
                showAlert('登録しました！');
            } catch (error) {
                console.error("Error adding document: ", error);
                showAlert('保存に失敗しました。', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = submitBtnOriginalText;
            }
        });

        // Read - データのリアルタイム監視
        function setupDataListener() {
            if (!currentUser) return;

            const colRef = getCollectionRef();
            if (!colRef) return;

            // RULE 2: No Complex Queries. Fetch all, sort in memory if needed.
            // (ここでは作成日時順にするため、本来はorderByが必要ですが、
            // インデックスエラーを避けるため全件取得してJSでソートします)
            const q = query(colRef);

            recordsBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">読み込み中...</td></tr>`;

            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                const rentals = [];
                snapshot.forEach((doc) => {
                    rentals.push({ id: doc.id, ...doc.data() });
                });

                // JavaScriptメモリ内で作成日時（降順）にソート
                rentals.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : Date.now();
                    const timeB = b.createdAt ? b.createdAt.toMillis() : Date.now();
                    return timeB - timeA;
                });

                renderTable(rentals);
                recordCount.innerText = `${rentals.length} 件`;

            }, (error) => {
                console.error("Error fetching data:", error);
                recordsBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">データの取得に失敗しました。</td></tr>`;
            });
        }

        // ---------------------------------------------------------
        // 6. UI Rendering & Interactions
        // ---------------------------------------------------------

        function renderTable(rentals) {
            recordsBody.innerHTML = '';
            
            if (rentals.length === 0) {
                recordsBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="p-8 text-center text-gray-500">
                            登録されたデータがありません。
                        </td>
                    </tr>
                `;
                return;
            }

            rentals.forEach(rental => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition duration-150';
                
                // 状況に応じたスタイル
                const statusBadgeClass = rental.status === '返却済' 
                    ? 'bg-green-100 text-green-800' 
                    : 'bg-yellow-100 text-yellow-800';

                // 返却予定日を過ぎているかのチェック
                const todayStr = new Date().toISOString().split('T')[0];
                const isOverdue = rental.status !== '返却済' && rental.returnDate < todayStr;
                const dateStyle = isOverdue ? 'text-red-600 font-bold' : 'text-gray-700';
                
                tr.innerHTML = `
                    <td class="p-4 border-b">
                        <div class="font-medium text-gray-900">${escapeHtml(rental.itemName)}</div>
                        <div class="text-xs text-gray-400">登録: ${escapeHtml(rental.creatorName)}</div>
                    </td>
                    <td class="p-4 border-b text-gray-700">${escapeHtml(rental.borrowerName)}</td>
                    <td class="p-4 border-b text-gray-700">${escapeHtml(rental.borrowDate)}</td>
                    <td class="p-4 border-b ${dateStyle}">${escapeHtml(rental.returnDate)}</td>
                    <td class="p-4 border-b">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusBadgeClass}">
                            ${escapeHtml(rental.status)}
                        </span>
                    </td>
                    <td class="p-4 border-b text-center">
                        <div class="flex justify-center space-x-2">
                            ${rental.status === '貸出中' 
                                ? `<button onclick="updateStatus('${rental.id}', '返却済')" class="text-xs bg-green-500 hover:bg-green-600 text-white py-1 px-2 rounded transition">返却する</button>` 
                                : `<button onclick="updateStatus('${rental.id}', '貸出中')" class="text-xs bg-gray-400 hover:bg-gray-500 text-white py-1 px-2 rounded transition">取消</button>`
                            }
                            <button onclick="requestDelete('${rental.id}')" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 py-1 px-2 rounded transition">削除</button>
                        </div>
                    </td>
                `;
                recordsBody.appendChild(tr);
            });
        }

        // Update - 状況の更新 (Globalスコープに公開)
        window.updateStatus = async (docId, newStatus) => {
            if (!currentUser) return;
            try {
                // RULE 1: Strict Paths
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rentals', docId);
                await updateDoc(docRef, {
                    status: newStatus,
                    updatedAt: serverTimestamp()
                });
            } catch (error) {
                console.error("Error updating document:", error);
                showAlert('更新に失敗しました。', 'error');
            }
        };

        // Delete - 削除のフロー (確認モーダル)
        window.requestDelete = (docId) => {
            itemToDelete = docId;
            deleteModal.style.display = 'flex';
        };

        cancelDeleteBtn.addEventListener('click', () => {
            itemToDelete = null;
            deleteModal.style.display = 'none';
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!currentUser || !itemToDelete) return;
            
            try {
                // RULE 1: Strict Paths
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rentals', itemToDelete);
                await deleteDoc(docRef);
                showAlert('削除しました。');
            } catch (error) {
                console.error("Error deleting document:", error);
                showAlert('削除に失敗しました。', 'error');
            } finally {
                itemToDelete = null;
                deleteModal.style.display = 'none';
            }
        });

        // ユーティリティ: XSS対策
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                 .toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

    </script>
</body>
</html>
